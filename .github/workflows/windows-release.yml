name: Windows release
on:
  push:
    paths:
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: ./build.ps1
      - name: Publish v0.1.0 if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create v0.1.0 dist/WiFiAnalyzer.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Wi-Fi Analyzer v0.1.0' --notes 'Windows x64. No regional lock in the app. / Windows x64. Региональной блокировки в приложении нет.'
